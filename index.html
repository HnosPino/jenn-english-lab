<style>

.btn:active{transform:scale(.97)} .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)} .btn.sm{padding:6px 10px;font-size:.85rem}

.cta{display:flex;align-items:center;gap:16px;text-decoration:none;border:2px solid var(--ink)} .cta>div{flex:1} .arrow{font-size:2rem;font-weight:800;color:var(--acc)}

.uh{background:var(--c);color:#fff;border-radius:20px;padding:22px} .uh .kicker{color:#fff;opacity:.85} .uh p{margin:.2em 0}

.vt{width:100%;border-collapse:collapse} .vt td,.vt th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top} .vt th{font-size:.8rem;text-transform:uppercase;color:var(--ink2)}
.gram table{border-collapse:collapse;width:100%;margin:10px 0;font-size:.95rem} .gram td,.gram th{border:1px solid var(--line);padding:7px 8px;text-align:left} .gram th{background:var(--bg)}
.gram i{background:#fff8e1;padding:1px 4px;border-radius:4px}
.spk{border:0;background:#eef1fb;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:1rem;vertical-align:middle;flex:none} .spk.sm{width:26px;height:26px;font-size:.8rem}

.blank{color:var(--acc);font-weight:800;letter-spacing:-1px}
.opts{display:flex;flex-wrap:wrap;gap:8px}

input.gap,.form input,.form select,.search,textarea{font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;background:#fff;color:var(--ink)}

.q.ok input.gap{border-color:var(--good);background:#ebfbee} .q.bad input.gap{border-color:var(--bad);background:#fff5f5}
.fb{font-size:.9rem;margin-top:6px} .fb:empty{display:none}
.inl{display:inline;border:0;padding:0} .inl input.gap{width:120px;display:inline-block;padding:4px 8px;margin:0 4px} .inl .fb{display:inline;margin-left:2px}

.gapn{color:var(--acc)}
.banner{display:flex;align-items:center;gap:16px;border-radius:14px;padding:14px 18px;margin-top:14px} .banner .big{font-family:Fraunces;font-size:2.2rem;font-weight:800}
.banner.good{background:#ebfbee;color:#1b5e20} .banner.mid{background:#fff9db;color:#7a4f01} .banner.low{background:#fff5f5;color:#8a1c1c}
.player{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0} .tr{background:var(--bg);padding:12px 14px;border-radius:10px;font-size:.95rem} .hidden{display:none!important}
.prompt{font-weight:600;font-size:1.05rem;background:#eef1fb;padding:12px 14px;border-radius:10px}
textarea{resize:vertical;line-height:1.6} .wc{font-size:.85rem;color:var(--ink2);margin-top:6px}
.fbbox{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}

.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)} .chip small{opacity:.7}
.model{background:#f3f0ff;border-radius:10px;padding:12px 14px;margin:8px 0;line-height:1.7}

.rub{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px} .rub label{display:flex;justify-content:space-between;gap:10px;background:var(--bg);border-radius:10px;padding:10px}
.rub small{display:block;color:var(--ink2);font-size:.78rem} .rub select{font:inherit;border-radius:8px;border:1.5px solid var(--line);padding:4px 8px;height:fit-content}
.decks{margin:12px 0}
.sw{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}

.fcat{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:700}
.front{font-family:Fraunces;font-size:clamp(1.6rem,5vw,2.3rem);font-weight:800}
.back{font-size:1.4rem;font-weight:700;color:var(--acc)} .fex{color:var(--ink2);font-style:italic;margin-top:6px}
.notice{border:2px dashed var(--ink2);border-radius:12px;padding:12px 16px;margin-top:14px;background:#fffdf3;font-weight:600;font-family:ui-monospace,Menlo,monospace;font-size:.92rem}
.instr{color:var(--ink2);font-style:italic}
.kwt{border-bottom:1px dashed var(--line);padding:10px 0} .kwt p{margin:4px 0} .kwt .key{font-weight:800;letter-spacing:.1em;color:var(--acc)} .kwt .q{border:0;padding-top:0}
.litem{border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:6px}
.timer{position:sticky;top:64px;z-index:6;margin:10px 0 0 auto;width:fit-content;background:var(--ink);color:#fff;padding:6px 14px;border-radius:999px;font-weight:700;font-variant-numeric:tabular-nums}
.timer.over{background:var(--bad)}
.result .scale{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0} .result .scale>div{flex:1;min-width:180px;background:var(--bg);border-radius:12px;padding:12px}
.result .scale b{display:block;font-family:Fraunces;font-size:1.5rem} .result .scale span{font-size:.8rem;color:var(--ink2)}
.sk{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;margin:8px 0;font-size:.92rem} .sk .bar{margin:0} .sk>b{text-align:right}
.warn{background:#fff4e6;border-radius:10px;padding:10px 12px}
.chart{width:100%;height:auto} .chart .gl{stroke:#ece7de} .chart .gl.pass{stroke:var(--good);stroke-dasharray:5 5} .chart .ax{font-size:11px;fill:var(--ink2)}
.chart .ln{fill:none;stroke:#b8c0dc;stroke-width:1.5} .chart .ma{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chart .dot.g{fill:var(--good)} .chart .dot.m{fill:var(--mid)} .chart .dot.r{fill:var(--bad)}
.utable{display:flex;flex-direction:column;gap:2px} .ur{display:grid;grid-template-columns:1fr repeat(5,38px);gap:4px;align-items:center;text-decoration:none;font-size:.88rem;padding:4px 0;border-bottom:1px solid #f1ede6}
.cell{font-style:normal;text-align:center;border-radius:6px;padding:3px 0;background:#f4f1eb;font-size:.78rem;font-weight:700;color:var(--ink2)}
.cell.g{background:#d3f9d8;color:#1b5e20} .cell.m{background:#fff3bf;color:#7a4f01} .cell.r{background:#ffe3e3;color:#8a1c1c}
.form label{display:block;font-weight:700;font-size:.9rem;margin:8px 0} .form label input,.form label select{margin-top:4px;font-weight:400}
.code{background:var(--ink);color:#e6ebff;padding:14px;border-radius:12px;overflow:auto;font-size:.8rem}
code{background:var(--bg);padding:1px 6px;border-radius:5px}

<script>
const CONTENT = {levels:[], exams:[], decks:{}};
// ===== NIVEL A1 =====
// Formato de ejercicios: ["pregunta", "correcta", "incorrecta", ...]  ó  {q:"pregunta con ___", a:["respuesta","alternativa"]}
CONTENT.levels.push({
id:"A1", name:"A1 · Beginner", color:"#2f9e44",
desc:"Te presentas, hablas de tu familia, tu rutina, tu casa y el clima con frases sencillas.",
units:[
{
id:"a1u1", title:"Hello! Me and my family", topic:"Verb to be · Subject pronouns · Possessive adjectives",
cando:"Puedo presentarme y presentar a mi familia.",
vocab:[["son","hijo"],["husband","esposo"],["child / children","niño / niños"],["nephew","sobrino"],["niece","sobrina"],["siblings","hermanos (hermanos y hermanas)"],["teenager","adolescente"],["kid","niño (informal)"],["single father","padre soltero"],["hometown","ciudad natal"],["How old are you?","¿Cuántos años tienes?"],["Where are you from?","¿De dónde eres?"]],
grammar:{title:"Verb to be + pronombres sujeto + posesivos",
html:`<p><b>Pronombres sujeto:</b> I, you, he, she, it, we, they.</p>
<table><tr><th>Sujeto</th><th>be (+)</th><th>(−)</th><th>Posesivo</th></tr>
<tr><td>I</td><td>am ('m)</td><td>am not</td><td>my</td></tr>
<tr><td>You</td><td>are ('re)</td><td>aren't</td><td>your</td></tr>
<tr><td>He / She / It</td><td>is ('s)</td><td>isn't</td><td>his / her / its</td></tr>
<tr><td>We / They</td><td>are</td><td>aren't</td><td>our / their</td></tr></table>
<p>✅ <i>I <b>am</b> 44 years old.</i> (en inglés la edad usa <b>be</b>, no "have").<br>✅ <i>He <b>is</b> a teenager.</i> · <i><b>Their</b> names are Tomás and Lucas.</i></p>
<p>⚠️ <b>Child</b> → singular, <b>children</b> → plural. <b>Woman</b> → <b>women</b>.</p>`,
ex:[
["I ___ 44 years old.","am","have","is"],
["My sons ___ very active.","are","is","be"],
["She ___ a meteorologist.","is","are","am"],
["This is my husband. ___ name is Andrés.","His","Her","Their"],
["We love ___ dog.","our","us","we"],
["Tomás and Lucas are my ___.","children","childs","child"],
{q:"___ are you from? — I'm from Bogotá.",a:["where"]},
{q:"How old ___ your son? — He's twelve.",a:["is"]}
]},
reading:{title:"Meet Jennifer",
text:`Hi! My name is Jennifer. I am 44 years old and I am from Colombia. I live in Bogotá with my husband and my two sons. My sons are twelve and nine. The older one is almost a teenager! My husband is an engineer. I am a meteorologist. Our family is small but very happy. We have a dog. His name is Max and he is very furry. My siblings live in another city, but my nephew and my niece visit us in December.`,
q:[["How old is Jennifer?","44","40","34"],["Who does Jennifer live with?","Her husband and two sons","Her siblings","Her nephew and niece"],["What is Jennifer's job?","Meteorologist","Engineer","Teacher"],["When do the nephew and niece visit?","In December","Every weekend","In June"]]},
listening:{text:`Hello, I'm Lucas. I'm nine years old. I'm from Bogotá, Colombia. My mum is Jennifer and my dad is Andrés. I have a brother. His name is Tomás and he is twelve. My favourite sport is soccer. Our dog is Max. He is black and white.`,
q:[["How old is Lucas?","Nine","Twelve","Ten"],["What is his brother's name?","Tomás","Andrés","Max"],["What colour is the dog?","Black and white","Brown","White"]]},
writing:{prompt:"Write about you and your family (25–40 words). Include: your name, age, city, family members and one pet or hobby.", min:25, keys:["I am","my","is","are"],
model:"My name is Jennifer. I am 44 years old and I live in Bogotá. I am married and I have two sons. They are twelve and nine. We have a dog. His name is Max."}
},
{
id:"a1u2", title:"My daily routine", topic:"Present simple · Adverbs of frequency",
cando:"Puedo describir mi rutina y la de otras personas.",

reading:{title:"Lake Tota: a fragile treasure",
text:`Lake Tota, which is located in Boyacá, is the largest natural lake in Colombia. It is a place where thousands of tourists go every year, especially to Playa Blanca, a beach that is 3,000 metres above sea level. However, the lake faces serious problems. Due to the intensive cultivation of onions around it, the water has been contaminated. Unlike other lakes in the region, Tota supplies water to more than 250,000 people. For this reason, environmental organisations, such as local foundations and universities, are working with farmers whose land is close to the lake to reduce pollution.`,

reading:{title:"The night of the landslide",
text:`It had been raining for almost two weeks when the hillside above the small town finally gave way. Most families were sleeping, but María, a local teacher, was still awake because she had been correcting exams. At around 2 a.m. she heard a strange noise, like thunder that would not stop. She looked out of the window and saw that the river had changed colour. Remembering the alert she had received that afternoon, she woke her neighbours and they ran uphill. By the time the mud reached the first houses, almost everybody had left. Rescue teams later found that the early-warning message had saved dozens of lives.`,
q:[["Why was María awake?","She had been correcting exams","She had heard the alert at 2 a.m.","She was waiting for the rescue"],["What made her suspicious?","A noise and the colour of the river","A phone call","Smoke"],["What did she do?","She woke her neighbours","She called the firefighters","She stayed at home"],["What does the last sentence suggest?","The alert system was effective","The rescue was late","Many people died"]]},
listening:{text:`So, I was walking out of the mall with my shopping bags. I'd just bought a present for my son's birthday. Suddenly, a guy on a motorbike approached me and grabbed my phone. I hadn't even seen him coming! I was so shocked that I didn't scream. Fortunately, a security guard had noticed what was happening and called the police.`,

writing:{prompt:"Write a story (140–190 words) that begins: 'It had been a long day, but the strangest thing happened when I got home.' Use at least three narrative tenses.", min:140, keys:["had","was","were","when","by the time"],

reading:{title:"Interview with a climate expert",
text:`In a recent interview, the former head of the forecast office explained that extreme weather events had become more frequent over the last decade. She pointed out that municipalities which had invested in early-warning systems had reduced losses significantly. When the journalist asked her whether the country was prepared for the next El Niño, she admitted that there was still a lot to do. She warned local governments not to wait until the emergency started and recommended training communities in advance. Finally, she said that she would continue working on these issues from her new consultancy and that she hoped to collaborate with international organisations.`,

reading:{title:"Who started the fire?",
text:`Last February a forest fire destroyed more than 300 hectares on the hills east of the city. Investigators still don't know exactly what happened, but they have some theories. The fire must have started near the hiking trail, because that is where the first smoke was seen. It might have been caused by a cigarette butt or by a campfire that wasn't properly extinguished. It can't have been lightning, since there were no storms that week. Experts agree that the authorities should have closed the trails earlier, as the drought had been warning everyone for weeks. "We felt helpless," a firefighter said. "It could have been much worse if the wind had changed direction."`,
q:[["Why do investigators think the fire started near the trail?","The first smoke was seen there","A hiker confessed","There was lightning there"],["Why can't it have been lightning?","There were no storms that week","It was too cold","It was daytime"],["What should the authorities have done?","Closed the trails earlier","Sent more firefighters","Nothing"],["What does the firefighter mean by 'It could have been much worse'?","The damage was limited compared to what was possible","The fire was the worst ever","They lost everything"]]},

writing:{prompt:"Write about a problem at work or at home that went wrong (140–190 words). Speculate on the causes and say what people should have done.", min:140, keys:["must have","might have","can't have","should have"],
model:"Last month our office presented a report to the ministry with several errors in the rainfall data, and it was an embarrassing situation. At first nobody understood what had happened. The data must have been copied from the wrong file, because the numbers belonged to the previous year. Someone might have been working with an old version of the spreadsheet, or the automatic update could have failed during the night. It can't have been a problem with the stations themselves, since the original records were correct. Looking back, I think we made several mistakes. We should have checked the document more carefully before sending it, and we shouldn't have prepared it in such a hurry. The team should also have used a shared folder instead of sending files by email. Fortunately, the ministry was understanding. It could have been much worse if the report had been published. Now we have a new procedure: every report is reviewed by two people."}

reading:{title:"A turning point",
text:`Two months ago Jennifer made one of the most difficult decisions of her life: she resigned from the institute where she had worked for almost two decades. "If you had asked me a year ago, I would have said I'd retire there," she admits. But the stress had become unbearable, and her health was suffering. "I wish I had listened to my body sooner." Twenty minutes after a particularly frustrating meeting, she wrote her letter. Now she has more time for her sons, her English classes and her new projects. "If I hadn't left, I wouldn't be starting my own consultancy now. Of course, I wish I had saved more money first," she laughs, "but in hindsight it was the right moment."`,

writing:{prompt:"Essay-style reflection (140–190 words): Describe an important decision in your life. What would have happened if you had chosen differently? What do you wish?", min:140, keys:["if","had","would have","wish"],
model:"One of the most important decisions in my life was choosing to study meteorology instead of engineering. At the time, my family thought engineering was a safer option, and if I had listened to them, I would probably have a very different career now. I might have earned more money, but I don't think I would have felt as fulfilled. Thanks to meteorology, I have worked in communities affected by floods and droughts, and I have seen how good information can save lives. If I hadn't chosen this path, I wouldn't be starting my own climate consultancy today. Of course, there are things I regret. I wish I had studied English more seriously when I was at university, because it would have opened many international doors earlier. I also wish I had spent more time with my sons during the busiest years. However, in hindsight, every decision taught me something, and I'm proud of the person I have become."}

vocab:[["responsible → irresponsible → responsibility","responsable → irresponsable → responsabilidad"],["available → availability","disponible → disponibilidad"],["recognise → recognition","reconocer → reconocimiento"],["comfortable → uncomfortable","cómodo → incómodo"],["fair → unfair","justo → injusto"],["lead → leader → leadership","dirigir → líder → liderazgo"],["anticipate → anticipatory","anticipar → anticipatorio"],["behave → behaviour → behavioural","comportarse → comportamiento"],["sustain → sustainability","sostener → sostenibilidad"],["heavy → heavily","pesado → fuertemente"]],
grammar:{title:"Formación de palabras",
html:`<p><b>Sufijos de sustantivo:</b> -tion/-sion (prediction), -ment (development), -ness (sadness), -ity (availability), -ship (leadership), -ance/-ence (importance), -er/-or/-ist (forecaster, meteorologist).</p>
<p><b>Adjetivos:</b> -ful (meaningful), -less (powerless, helpless), -able/-ible (reliable), -ous (dangerous), -al (environmental), -ive (proactive).</p>
<p><b>Negativos:</b> un- (unfair, uncomfortable), in-/im-/il-/ir- (incorrect, impossible, illegal, irresponsible), dis- (disagree), mis- (misunderstand).</p>
<p><b>Adverbios:</b> -ly (heavily, mainly, suddenly). <b>Verbos:</b> -ise/-ize (prioritise), en- (enable), -en (worsen).</p>
<p><b>Colocaciones:</b> <i>make a decision, take a risk, heavy rain, strong wind, issue an alert, raise awareness, pay attention, do research.</i></p>`,
ex:[
["Throwing cigarette butts in the forest is very ___. (RESPONSIBLE)","irresponsible","unresponsible","disresponsible"],
["Water ___ is a problem in La Guajira. (AVAILABLE)","availability","availableness","availation"],
["She showed great ___ during the crisis. (LEAD)","leadership","leaderness","leadment"],
["The rain fell ___ all night. (HEAVY)","heavily","heavy","heavyly"],
["The team received international ___. (RECOGNISE)","recognition","recognisement","recognising"],
["Which is the natural collocation?","make a decision","do a decision","take a decision"],
{q:"The new system is very ___ (RELY). It never fails.",a:["reliable"]},
{q:"We felt completely ___ (POWER) during the floods.",a:["powerless"]}
]},
reading:{title:"Climate services for farmers",
text:`Climate services are becoming increasingly important for agricultural development. Their main objective is to transform complex meteorological information into practical recommendations. For example, a farmer who knows that a long drought is likely can make the decision to plant more resistant crops or improve irrigation management. Unfortunately, the availability of these services is still unequal: many rural communities lack reliable internet connections, and some farmers feel uncomfortable using digital tools. Experts argue that the effectiveness of climate services depends not only on accurate predictions but also on trust and communication. Training local leaders has proved especially successful, because farmers usually trust their neighbours more than distant institutions.`,
q:[["What is the main objective of climate services?","To turn complex data into practical advice","To replace farmers","To sell technology"],["What is one problem mentioned?","Unequal availability","Too many services","Expensive crops"],["Why is training local leaders successful?","Farmers trust their neighbours","Leaders have more money","It's cheaper"]]},
listening:{text:`Welcome to Climate Today. Our guest says that sustainability is not only an environmental issue but also an economic one. In her opinion, unpredictable weather has made farming increasingly risky, and the inability to anticipate extreme events causes enormous losses. She believes that anticipatory actions are the most cost-effective solution available.`,
q:[["According to the guest, sustainability is...","environmental and economic","only environmental","not important"],["What has made farming risky?","Unpredictable weather","Technology","Taxes"],["What is the most cost-effective solution?","Anticipatory actions","More insurance","New crops"]]},
writing:{prompt:"Write a report paragraph (140–190 words) about an environmental problem in your region. Use at least eight words with prefixes or suffixes.", min:140, keys:["tion","ity","ful","un","ly"],
model:"This report aims to describe the main environmental problem in the Bogotá savannah: the increasing vulnerability of water sources. Over the last decade, urban expansion has significantly reduced the availability of clean water. Several wetlands have disappeared due to irresponsible construction, and the contamination of the Bogotá River remains a serious concern. In addition, unpredictable rainfall patterns have made water management more complicated. During dry seasons, some municipalities have experienced shortages, while heavy rainfall periods cause flooding in low-lying neighbourhoods. One positive development is the growing environmental awareness among young people, who are increasingly involved in conservation projects. Nevertheless, these efforts are insufficient without political commitment. It is therefore recommended that local authorities improve the protection of wetlands, invest in sustainable drainage systems and strengthen early-warning systems. Furthermore, public education campaigns would help citizens understand their responsibility in reducing water consumption."}
},

grammar:{title:"Comparativos avanzados",
html:`<p><b>Modificadores:</b> <i>far / much / a lot / considerably</i> hotter (gran diferencia) · <i>slightly / a bit / a little</i> hotter (pequeña).</p>
<p><b>Superlativo enfático:</b> <i><b>by far</b> the hottest month</i> · <i>one of <b>the most</b> dangerous seasons <b>on record</b></i>.</p>
<p><b>as ... as:</b> <i>twice <b>as</b> much rain <b>as</b> normal</i> · <i>not <b>nearly</b> as cold as last year</i> · <i>just as important as</i>.</p>
<p><b>Doble comparativo:</b> <i><b>The higher</b> the altitude, <b>the colder</b> the temperature.</i> · <b>Progresivo:</b> <i>more and more frequent / hotter and hotter / increasingly</i>.</p>
<p><b>Contraste:</b> <i>The north rained the whole weekend, <b>whereas</b> the south was hotter.</i></p>`,
ex:[
["August was ___ hotter than July: 4 degrees more!","much","slightly","more"],
["This was ___ the worst fire season on record.","by far","much","far more"],
["It rained twice ___ much as normal.","as","than","so"],
["The higher you go, ___ it gets.","the colder","colder","the coldest"],
["This year's drought is not ___ as severe as in 2016.","nearly","much","far"],
["Extreme events are becoming ___ frequent.","increasingly","increasing","more and"],
{q:"The more you practise, the ___ (good) you get.",a:["better"]},
{q:"The north was rainy, ___ the south was dry and hot. (mientras que)",a:["whereas","while"]}
]},
reading:{title:"Two very different seasons",
text:`Compared with the previous year, 2024 was a far more challenging year for Colombian forecasters. The first months were by far the driest in a decade due to El Niño, and the number of forest fires was nearly three times as high as the average. Bogotá had to ration water, something that had not happened in decades. In contrast, the second half of the year brought slightly more rain than normal, although not nearly as much as during La Niña in 2010–2011. Experts warn that the more the planet warms, the more extreme these variations will become, which means that climate adaptation will be increasingly important for every sector of the economy.`,
q:[["How did the number of fires compare with the average?","Nearly three times as high","Slightly lower","The same"],["What was unusual in Bogotá?","Water rationing","Snow","Hurricanes"],["How was the rain in the second half?","Slightly more than normal","Much more than 2010","Much less than normal"],["What do experts warn?","More warming means more extreme variation","Variations will disappear","The economy will grow"]]},
listening:{text:`Compared with my old job, this new life is much less stressful. I earn slightly less money, but I have far more time for my family. The more time I spend with my sons, the happier I feel. And my English is getting better and better! Honestly, leaving was by far the best decision I've made.`,
q:[["How is the new life compared with the old job?","Much less stressful","More stressful","The same"],["What about money?","She earns slightly less","She earns much more","She earns nothing"],["What was 'by far the best decision'?","Leaving her job","Studying English","Moving house"]]},
writing:{prompt:"B2 First essay (140–190 words): 'Living in a big city is better than living in a small town.' Do you agree? Write about 1) opportunities 2) quality of life 3) your own idea. Use advanced comparison.", min:140, keys:["far","than","the more","whereas","as"],
model:"Many people believe that big cities offer a much better life than small towns. In my opinion, the answer is not that simple. On the one hand, big cities provide far more opportunities. Universities, hospitals and jobs are considerably more varied, and it is much easier to develop a professional career. For example, international organisations are usually based in capitals, whereas small towns rarely offer that kind of work. On the other hand, quality of life is often better in small towns. The air is cleaner, the traffic is not nearly as bad and people tend to know their neighbours. The bigger the city, the more time people spend commuting, which means less time for family. A further point is safety: small towns are generally slightly safer, although this is not always true. To sum up, I believe big cities are better for building a career, while small towns are better for enjoying everyday life. The ideal solution might be working remotely from a small town, which is increasingly possible nowadays."}
}
]});

{type:"text", skill:"Reading", title:"Part 5 · Reading", instr:"Read the text and choose the best answer.",
text:"For most of her career, Laura Méndez measured success in numbers: hours worked, reports delivered, promotions obtained. As a senior climate analyst, she had become the person everyone called when a crisis began. 'I liked being needed,' she admits. 'It took me years to understand that being needed and being valued are not the same thing.' The turning point came during an exceptionally long dry season, when her team worked fourteen-hour days for three months. Laura began to suffer from headaches and insomnia, and one morning, during a meeting in which her proposals were once again ignored, she simply stood up and left. 'Twenty minutes later I had written my resignation letter. I didn't plan it. My body decided for me.' The months that followed were not easy. Without the structure of an office, she felt lost, and some colleagues interpreted her decision as weakness. Yet gradually, she discovered unexpected pleasures: cooking with her children, studying languages, walking in the mountains without checking her phone. Today she runs a small consultancy that helps farmers adapt to climate change. She earns less, works fewer hours and, by her own account, is far more productive. 'Rest isn't the opposite of work,' she says. 'It's what makes good work possible.'",

{type:"write", skill:"Writing", title:"Part 1 · Essay (140–190 words)", instr:"Write an essay using all the notes and give reasons for your point of view.", prompt:"'Governments should spend more money on preventing natural disasters than on responding to them.' Do you agree? Notes: 1) cost  2) saving lives  3) your own idea.", min:140,
model:"Every year, natural disasters cause enormous human and economic losses. In my view, governments should invest considerably more in prevention than in emergency response. Firstly, prevention is far cheaper. Studies show that every dollar invested in early-warning systems and safer infrastructure can save several dollars in reconstruction costs. Rebuilding roads, schools and houses after a landslide is much more expensive than protecting hillsides before the rainy season. Secondly, and most importantly, prevention saves lives. When communities receive alerts in advance and know what to do, they can evacuate before the danger arrives. Responding after a disaster, however quickly, cannot bring back the people who have died. Finally, prevention also strengthens communities. When local leaders are trained and families have emergency plans, people feel less helpless and more responsible for their own safety. Of course, governments still need emergency services, since not every disaster can be predicted. Nevertheless, I firmly believe that a society which prepares in advance is safer, fairer and, in the long term, more prosperous."},
{type:"write", skill:"Writing", title:"Part 2 · Article / Email / Review (140–190 words)", instr:"Choose and write ONE.", prompt:"Article for an international magazine: 'The day that changed my life'. Describe what happened, how you felt and what you learned.", min:140,
model:"Some days pass without leaving a trace; others divide your life into 'before' and 'after'. For me, that day was a grey Tuesday in September. I had been working at the same institute for almost twenty years. I loved my job, but I had been exhausted for months. That morning, during yet another meeting in which nobody seemed to listen, something inside me broke. I went back to my desk and, twenty minutes later, I had written my resignation letter. At first I felt terrified. What would I do? Had I made a terrible mistake? But as the weeks passed, fear turned into relief. I started sleeping properly again. I cooked with my sons, I studied English every day and I began planning my own consultancy. Looking back, I've learned that courage doesn't always mean having a perfect plan. Sometimes it simply means listening to yourself and accepting that it's time for a change. I wish I had done it sooner, but I'm grateful that I finally did."}

// ================== JENN ENGLISH LAB · MOTOR ==================
const LS_KEY = "jel_v1";
const SKILLS = ["vocab","grammar","reading","listening","writing"];
const SKILL_ES = {vocab:"Vocabulario",grammar:"Gramática",reading:"Lectura",listening:"Escucha",writing:"Escritura"};
const SKILL_IC = {vocab:"📚",grammar:"🧩",reading:"📖",listening:"🎧",writing:"✍️"};
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = s => esc(s).replace(/_{3,}/g, '<span class="blank">_____</span>').replace(/\n/g,"<br>");
const norm = s => String(s||"").toLowerCase().replace(/[’‘`]/g,"'").replace(/[.!?,;]+$/,"").replace(/\s+/g," ").trim();
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const today = () => { const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); };
const DAY = 86400000;

// ---------- Estado ----------
function defState(){ return {units:{},hist:[],exams:{},cards:{},mywords:[],drafts:{},streak:{last:null,count:0},xp:0,
  settings:{accent:"en-GB",rate:0.9,free:false,name:"Jenn"}}; }
function loadState(){
  try{ const r = localStorage.getItem(LS_KEY);
    if(r){ const s = JSON.parse(r); const d = defState(); return Object.assign(d, s, {settings:Object.assign(d.settings, s.settings||{})}); }
  }catch(e){}
  return defState();
}
let S = loadState();
let storageOK = true;
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); storageOK = true; }catch(e){ storageOK = false; } }

function bumpStreak(){
  const t = today(); if (S.streak.last === t) return;
  const y = new Date(Date.now()-DAY); const ys = y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
  S.streak.count = (S.streak.last === ys) ? S.streak.count+1 : 1; S.streak.last = t;
}
function record(kind, id, skill, pct, level, label){
  S.hist.push({d:Date.now(), k:kind, id, s:skill, p:pct, lv:level, l:label});
  if (S.hist.length > 600) S.hist.shift();
  S.xp += 5 + Math.round(pct/10);
  bumpStreak(); save();
}
function setUnitScore(u, skill, pct){
  S.units[u.id] = S.units[u.id] || {};
  const prev = S.units[u.id][skill];
  S.units[u.id][skill] = Math.max(prev||0, pct);
  record("unit", u.id, skill, pct, u.level, u.title+" · "+SKILL_ES[skill]);
}

// ---------- Datos derivados ----------
const LEVELS = CONTENT.levels;
const ALL_UNITS = []; LEVELS.forEach(L => L.units.forEach((u,i) => { u.level = L.id; u.idx = i; ALL_UNITS.push(u); }));
const unitById = id => ALL_UNITS.find(u => u.id.toLowerCase() === String(id).toLowerCase());
const unitDone = u => SKILLS.filter(k => (S.units[u.id]||{})[k] >= 60).length;
const unitPct = u => Math.round(SKILLS.reduce((a,k)=>a+((S.units[u.id]||{})[k]||0),0)/SKILLS.length);
const levelPct = L => Math.round(L.units.reduce((a,u)=>a+unitDone(u)/5*100,0)/L.units.length);
function examBest(id){ const h = S.exams[id]||[]; return h.length ? Math.max(...h.map(x=>x.p)) : null; }
function levelUnlocked(L){
  const i = LEVELS.indexOf(L); if (i===0 || S.settings.free) return true;
  const P = LEVELS[i-1]; const ex = CONTENT.exams.find(e=>e.level===P.id);
  return levelPct(P) >= 60 || (ex && (examBest(ex.id)||0) >= 70);
}
function unitUnlocked(u){
  const L = LEVELS.find(l=>l.id===u.level);
  if (!levelUnlocked(L)) return false;
  if (S.settings.free || u.idx===0) return true;
  return unitDone(L.units[u.idx-1]) >= 3;
}
function nextUnit(){
  for (const u of ALL_UNITS){ if (unitUnlocked(u) && unitDone(u) < 5) return u; }
  return null;
}

// ---------- Voz (Text-to-Speech) ----------
let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices(); }catch(e){} }
if ("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(){
  const acc = S.settings.accent;
  return voices.find(v=>v.lang===acc && /Google|Natural|Premium|Enhanced/i.test(v.name)) || voices.find(v=>v.lang===acc) ||
         voices.find(v=>v.lang && v.lang.startsWith(acc.slice(0,2)) && v.lang.replace("_","-")===acc) || voices.find(v=>v.lang && v.lang.startsWith("en"));
}
function speak(text, rateMul=1){
  if (!("speechSynthesis" in window)){ toast("Tu navegador no tiene voz. Prueba con Chrome, Edge o Safari."); return; }
  try{
    speechSynthesis.cancel();
    const parts = String(text).replace(/\n/g," ").match(/[^.!?]+[.!?]*/g) || [text];
    parts.forEach(p => { const ut = new SpeechSynthesisUtterance(p.trim()); const v = pickVoice(); if (v) ut.voice = v;
      ut.lang = v ? v.lang : S.settings.accent; ut.rate = S.settings.rate*rateMul; speechSynthesis.speak(ut); });
  }catch(e){ toast("No se pudo reproducir el audio en este navegador."); }
}
function stopSpeak(){ try{ speechSynthesis.cancel(); }catch(e){} }
const sp = (t, small) => `<button class="spk${small?" sm":""}" data-say="${esc(t)}" title="Escuchar" aria-label="Escuchar">🔊</button>`;

// ---------- Toast ----------
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2600); }

// ---------- Bloques de ejercicios ----------
function qBlock(items, name, startN=1){
  return items.map((it,i)=>{
    const n = startN+i;
    if (Array.isArray(it)){
      const opts = shuffle(it.slice(1));
      return `<div class="q" data-type="mc" data-c="${esc(it[1])}"><p class="qt"><span class="qn">${n}</span>${fmt(it[0])}</p>
        <div class="opts">${opts.map(o=>`<label class="opt"><input type="radio" name="${name}-${i}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}</div><div class="fb"></div></div>`;
    }
    return `<div class="q" data-type="gap" data-a="${esc(JSON.stringify(it.a))}"><p class="qt"><span class="qn">${n}</span>${fmt(it.q)}</p>
      <input class="gap" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe tu respuesta"><div class="fb"></div></div>`;
  }).join("");
}
function grade(container){
  let ok=0, n=0;
  $$(".q", container).forEach(q=>{
    n++; let good=false, right="";
    if (q.dataset.type==="mc"){
      const sel = $("input:checked", q); right = q.dataset.c; good = !!sel && sel.value===right;
      $$(".opt", q).forEach(l=>{ const v=$("input",l).value; l.classList.toggle("right", v===right); l.classList.toggle("wrong", !!sel && sel.value===v && v!==right); });
    } else {
      const a = JSON.parse(q.dataset.a); const v = norm($("input",q).value); good = a.some(x=>norm(x)===v); right = a.join(" / ");
    }
    if (good) ok++;
    q.classList.toggle("ok", good); q.classList.toggle("bad", !good);
    $(".fb", q).innerHTML = good ? "✅" : `❌ <b>${esc(right)}</b>`;
  });
  return n ? Math.round(ok/n*100) : 0;
}
function scoreBanner(p, extra=""){
  const msg = p>=90?"¡Excelente! 🌟":p>=70?"¡Muy bien! 👏":p>=50?"Vas bien, repasa los errores 💪":"Repasa la explicación y vuelve a intentarlo 🔁";
  return `<div class="banner ${p>=70?"good":p>=50?"mid":"low"}"><div class="big">${p}%</div><div>${msg}${extra}</div></div>`;
}

const RUBRIC = [["Contenido","¿Respondí todo lo que pide la tarea?"],["Logro comunicativo","¿El tono y el formato son adecuados (email, artículo...)?"],["Organización","¿Uso conectores y párrafos? ¿Se entiende el orden?"],["Lenguaje","¿Vocabulario y gramática variados y correctos para el nivel?"]];
function writingChecks(text, min, keys){
  const words = (text.trim().match(/\b[\w'’-]+\b/g)||[]).length; const low = " "+text.toLowerCase()+" ";
  const used = (keys||[]).map(k=>[k, low.includes(k.toLowerCase())]);
  const tips = [];
  if (/\bi\b/.test(text)) tips.push("Escribe <b>I</b> (yo) siempre en mayúscula.");
  if (/(^|[.!?]\s+)[a-z]/.test(text.trim())) tips.push("Empieza cada oración con mayúscula.");
  if (/\bhave \d+ years\b/i.test(text)) tips.push("La edad va con <b>be</b>: <i>I am 44 years old</i>.");
  if (/\bdepends? of\b/i.test(text)) tips.push("Es <b>depend on</b>, no <i>depend of</i>.");
  if (/\bdidn'?t \w+ed\b/i.test(text) || /\bdid not \w+ed\b/i.test(text)) tips.push("Después de <b>didn't</b> va el verbo base: <i>I didn't study</i>.");
  if (/\b(he|she|it) (don't)\b/i.test(text)) tips.push("Con he/she/it usa <b>doesn't</b>.");
  if (/\bpeople is\b/i.test(text)) tips.push("<b>People</b> es plural: <i>people are</i>.");
  if (/\bmore (better|bigger|hotter|colder|easier)\b/i.test(text)) tips.push("No uses <i>more</i> con -er: <b>better</b>, no <i>more better</i>.");
  if (/\bexplain me\b/i.test(text)) tips.push("Es <b>explain to me</b>.");
  if (/\bsaid me\b/i.test(text)) tips.push("Es <b>told me</b> o <b>said (to me)</b>.");
  if (!/[.!?]\s*$/.test(text.trim()) && words>3) tips.push("Termina con punto final.");
  return {words, used, tips, okLen: words >= min};
}
function writingUI(id, prompt, min, keys, model, onScore){
  const d = S.drafts[id] || "";
  return {html:`<div class="card"><p class="prompt">${fmt(prompt)}</p><textarea id="wt-${id}" rows="8" placeholder="Write here...">${esc(d)}</textarea>
    <div class="wc"><span id="wcn-${id}">0</span> palabras · mínimo ${min}</div>
    <div class="row"><button class="btn" id="wchk-${id}">Revisar mi texto</button></div><div id="wfb-${id}"></div></div>`,
  wire(){

        ${c.tips.length?`<p><b>Revisa:</b></p><ul>${c.tips.map(t=>`<li>${t}</li>`).join("")}</ul>`:`<p>✅ No se detectaron errores frecuentes.</p>`}
        <details open><summary><b>Modelo de respuesta</b> ${sp(model,1)}</summary><div class="model">${esc(model).replace(/\n/g,"<br>")}</div></details>
        <p class="muted small">Compara tu texto con el modelo y autoevalúate con los criterios de Cambridge (0–5 cada uno):</p>
        <div class="rub">${RUBRIC.map((r,i)=>`<label><span><b>${r[0]}</b><small>${r[1]}</small></span><select data-r="${i}">${[0,1,2,3,4,5].map(n=>`<option ${n===3?"selected":""}>${n}</option>`).join("")}</select></label>`).join("")}</div>

const BOX_DAYS = [0,1,2,4,8,16,32];
function cardKey(c){ return c[0]+"|"+c[1]; }
function deckCards(name){
  const my = S.mywords.map(w=>[w.en,w.es,w.cat||"Mis palabras",w.ex||""]);
  if (name==="Mis palabras") return my;
  if (name==="Todas") return Object.values(CONTENT.decks).flat().concat(my);
  if (name==="Para hoy") return dueCards();
  return CONTENT.decks[name] || [];
}
function dueCards(){
  const all = Object.values(CONTENT.decks).flat().concat(S.mywords.map(w=>[w.en,w.es,w.cat||"Mis palabras",w.ex||""]));
  const now = Date.now();
  return all.filter(c=>{ const s = S.cards[cardKey(c)]; return s && s.due <= now; });
}

const SCALE = {
  A1:{pts:[[0,80],[50,90],[70,100],[100,120]], bands:[[100,"A1 alcanzado ✅"],[0,"Pre-A1 – sigue practicando"]]},
  A2:{pts:[[0,82],[45,100],[70,120],[85,133],[100,150]], bands:[[140,"Grade A · nivel B1"],[133,"Grade B · A2"],[120,"Grade C · A2 (aprobado)"],[100,"Nivel A1 (no aprobado)"],[0,"Por debajo de A1"]]},
  B1:{pts:[[0,102],[45,120],[70,140],[85,153],[100,170]], bands:[[160,"Grade A · nivel B2"],[153,"Grade B · B1"],[140,"Grade C · B1 (aprobado)"],[120,"Nivel A2 (no aprobado)"],[0,"Por debajo de A2"]]},
  B2:{pts:[[0,122],[45,140],[70,160],[80,173],[100,190]], bands:[[180,"Grade A · nivel C1"],[173,"Grade B · B2"],[160,"Grade C · B2 (aprobado)"],[140,"Nivel B1 (no aprobado)"],[0,"Por debajo de B1"]]}
};
function toScale(level, p){ const pts = SCALE[level].pts; for (let i=1;i<pts.length;i++){ if (p<=pts[i][0]){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; return Math.round(y0+(p-x0)/(x1-x0)*(y1-y0)); } } return pts[pts.length-1][1]; }
function band(level, sc){ return SCALE[level].bands.find(b=>sc>=b[0])[1]; }

  const first = S.hist.slice(0,10), lastN = S.hist.slice(-10);
  const avg = a => a.length? Math.round(a.reduce((x,h)=>x+h.p,0)/a.length) : null;
  const improve = (S.hist.length>=12) ? avg(lastN)-avg(first) : null;
  const best = skillAvg.filter(s=>s[1]!=null).sort((a,b)=>b[1]-a[1]);
  render(`<h1>📈 Mi progreso</h1>
  <div class="stats card"><div><b>${S.xp}</b><span>XP</span></div><div><b>${S.streak.count||0}</b><span>racha (días)</span></div><div><b>${ALL_UNITS.filter(u=>unitDone(u)===5).length}/${ALL_UNITS.length}</b><span>unidades completas</span></div><div><b>${S.hist.length}</b><span>actividades</span></div></div>
  <div class="grid2">
    <div class="card"><h3>Avance por nivel</h3>${LEVELS.map(L=>`<div class="sk"><span><b style="color:${L.color}">${L.id}</b></span><div class="bar"><i style="width:${levelPct(L)}%;background:${L.color}"></i></div><b>${levelPct(L)}%</b></div>`).join("")}</div>
    <div class="card"><h3>Promedio por habilidad</h3>${skillAvg.map(([k,v,n])=>`<div class="sk"><span>${SKILL_IC[k]} ${SKILL_ES[k]}</span><div class="bar"><i style="width:${v||0}%;background:${v==null?"#ccc":v>=70?"var(--good)":v>=50?"var(--mid)":"var(--bad)"}"></i></div><b>${v==null?"—":v+"%"}</b></div>`).join("")}
    ${best.length>1?`<p class="small">💪 Fortaleza: <b>${SKILL_ES[best[0][0]]}</b> · 🎯 A reforzar: <b>${SKILL_ES[best[best.length-1][0]]}</b></p>`:""}</div>
  </div>
  <div class="card"><h3>Tus últimas ${hist.length} actividades ${improve!=null?`<span class="chip ${improve>=0?"on":""}">${improve>=0?"▲":"▼"} ${Math.abs(improve)} pts vs. tus inicios</span>`:""}</h3>${chart(hist)}</div>
  <div class="grid2">
    <div class="card"><h3>🔁 Para repasar (menos de 70 %)</h3>${weak.length?`<ul class="list">${weak.slice(0,12).map(([u,k])=>`<li><a href="#unit-${u.id}" data-tab="${k}">${u.level} · ${esc(u.title)} · ${SKILL_IC[k]} ${SKILL_ES[k]}</a><b class="${S.units[u.id][k]>=50?"m":"r"}">${S.units[u.id][k]}%</b></li>`).join("")}</ul>`:`<p class="muted">¡Nada pendiente! Todo lo que has hecho está sobre 70 %.</p>`}</div>
    <div class="card"><h3>🎓 Historial de simulacros</h3>${Object.keys(S.exams).length?`<table class="vt"><tr><th>Examen</th><th>Fecha</th><th>%</th><th>Escala</th></tr>${Object.entries(S.exams).flatMap(([id,arr])=>arr.map(x=>[id,x])).sort((a,b)=>b[1].d-a[1].d).map(([id,x])=>`<tr><td>${esc(CONTENT.exams.find(e=>e.id===id).name)}</td><td>${new Date(x.d).toLocaleDateString()}</td><td><b>${x.p}%</b></td><td>${x.sc}</td></tr>`).join("")}</table>`:`<p class="muted">Aún no has guardado simulacros.</p>`}</div>
  </div>
  <div class="card"><h3>Detalle por unidad</h3><div class="utable">${LEVELS.map(L=>L.units.map(u=>`<a href="#unit-${u.id}" class="ur"><span><b style="color:${L.color}">${L.id}</b> ${esc(u.title)}</span>${SKILLS.map(k=>{const v=(S.units[u.id]||{})[k]; return `<i class="cell ${v==null?"":v>=70?"g":v>=50?"m":"r"}" title="${SKILL_ES[k]}">${v==null?"·":v}</i>`;}).join("")}</a>`).join("")).join("")}</div>
  <p class="muted small">Columnas: 📚 Vocab · 🧩 Gram · 📖 Lect · 🎧 Escucha · ✍️ Escrit. Se guarda tu mejor puntaje por sección.</p></div>
  <div class="row"><a class="btn ghost" href="#settings">💾 Respaldo / pasar progreso a otro dispositivo</a></div>`);
  $$("[data-tab]").forEach(a=>a.addEventListener("click",()=>{ unitTab=a.dataset.tab; VIEWS._lastUnit=a.getAttribute("href").slice(6); }));
};
function chart(h){
  if (h.length<2) return `<p class="muted">Haz al menos 2 actividades para ver tu curva de progreso.</p>`;
  const W=640, H=180, P=28; const xs = i => P + i*(W-2*P)/(h.length-1); const ys = v => H-P - v*(H-2*P)/100;
  const pts = h.map((x,i)=>`${xs(i)},${ys(x.p)}`).join(" ");
  const ma = h.map((x,i)=>{ const s = h.slice(Math.max(0,i-4), i+1); return `${xs(i)},${ys(s.reduce((a,b)=>a+b.p,0)/s.length)}`; }).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Puntajes recientes">
  ${[0,50,70,100].map(v=>`<line x1="${P}" x2="${W-P}" y1="${ys(v)}" y2="${ys(v)}" class="gl ${v===70?"pass":""}"/><text x="2" y="${ys(v)+4}" class="ax">${v}</text>`).join("")}
  <polyline points="${pts}" class="ln"/><polyline points="${ma}" class="ma"/>
  ${h.map((x,i)=>`<circle cx="${xs(i)}" cy="${ys(x.p)}" r="4" class="dot ${x.p>=70?"g":x.p>=50?"m":"r"}"><title>${esc(x.l||x.id)}: ${x.p}%</title></circle>`).join("")}</svg>
  <p class="muted small">Puntos = cada actividad · línea gruesa = tendencia (promedio móvil) · línea punteada = 70 % (aprobado Cambridge).</p>`;
}

VIEWS.create = () => {
  render(`<h1>➕ Crear mis palabras</h1><p class="muted">Agrega el vocabulario nuevo de cada clase. Se suma automáticamente a tus tarjetas y a la práctica rápida.</p>
  <form class="card form" id="wf"><div class="grid2"><label>Inglés<input name="en" required placeholder="e.g. hailstorm"></label><label>Español<input name="es" required placeholder="granizada"></label></div>
  <div class="grid2"><label>Ejemplo (opcional)<input name="ex" placeholder="A hailstorm hit Bogotá."></label><label>Categoría<input name="cat" list="cats" placeholder="Mis palabras"><datalist id="cats">${Object.keys(CONTENT.decks).map(c=>`<option>${esc(c)}`).join("")}</datalist></label></div>
  <div class="row"><button class="btn">Agregar</button></div></form>
  <div class="card"><h3>Mis palabras (${S.mywords.length})</h3>${S.mywords.length?`<table class="vt">${S.mywords.map((w,i)=>`<tr><td>${sp(w.en,1)} <b>${esc(w.en)}</b></td><td>${esc(w.es)}<br><small class="muted">${esc(w.ex||"")} · ${esc(w.cat||"Mis palabras")}</small></td><td><button class="btn ghost sm" data-del="${i}">🗑</button></td></tr>`).join("")}</table>`:`<p class="muted">Aún no has agregado palabras.</p>`}
  <details><summary>Agregar varias a la vez</summary><p class="small muted">Una por línea: <code>inglés ; español ; ejemplo</code></p><textarea id="bulk" rows="5" placeholder="pouring ; aguacero ; It's pouring outside."></textarea><button class="btn" id="bulkAdd">Agregar todas</button></details></div>
  <div class="card"><h3>🛠 App libre de elaboración</h3><p>Todo el curso vive en un único archivo HTML. Dentro del código, el objeto <code>CONTENT</code> contiene niveles, unidades, ejercicios, simulacros y mazos de vocabulario en un formato sencillo. Cualquier profesor o estudiante puede copiarlo, editarlo y publicarlo gratis (por ejemplo en GitHub Pages o Netlify).</p>
  <pre class="code">{ id:"b1u7", title:"Mi nueva unidad", topic:"...", cando:"...",
  vocab:[["word","palabra"]],
  grammar:{ title:"...", html:"&lt;p&gt;explicación&lt;/p&gt;",
    ex:[ ["Pregunta ___","correcta","incorrecta","incorrecta"], {q:"Escribe ___", a:["respuesta"]} ] },
  reading:{ title:"...", text:"...", q:[["¿...?","correcta","x","y"]] },
  listening:{ text:"guion que leerá la voz", q:[...] },
  writing:{ prompt:"...", min:60, keys:["because"], model:"..." } }</pre></div>`);
  $("#wf").onsubmit = ev => { ev.preventDefault(); const f = new FormData(ev.target); S.mywords.push({en:f.get("en").trim(), es:f.get("es").trim(), ex:f.get("ex").trim(), cat:f.get("cat").trim()||"Mis palabras"}); save(); toast("Palabra agregada ✅"); VIEWS.create(); };
  $$("[data-del]").forEach(b=>b.onclick=()=>{ S.mywords.splice(+b.dataset.del,1); save(); VIEWS.create(); });
  $("#bulkAdd").onclick = () => { const lines = $("#bulk").value.split("\n").map(l=>l.split(";").map(x=>x.trim())).filter(l=>l[0]&&l[1]); lines.forEach(l=>S.mywords.push({en:l[0],es:l[1],ex:l[2]||"",cat:"Mis palabras"})); save(); toast(lines.length+" palabras agregadas"); VIEWS.create(); };
};

// ---------- AJUSTES ----------
VIEWS.settings = () => {
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  render(`<h1>⚙️ Ajustes y respaldo</h1>
  <form class="card form" id="sf">
   <label>Tu nombre<input name="name" value="${esc(S.settings.name)}"></label>
   <label>Acento de la voz<select name="accent"><option value="en-GB" ${S.settings.accent==="en-GB"?"selected":""}>🇬🇧 Británico (Cambridge)</option><option value="en-US" ${S.settings.accent==="en-US"?"selected":""}>🇺🇸 Americano</option></select></label>
   <label>Velocidad de la voz: <b id="rv">${S.settings.rate}</b><input type="range" name="rate" min="0.6" max="1.2" step="0.05" value="${S.settings.rate}"></label>
   <label class="sw"><input type="checkbox" name="free" ${S.settings.free?"checked":""}> Modo libre (desbloquear todos los niveles y unidades)</label>
   <div class="row"><button class="btn">Guardar ajustes</button><button type="button" class="btn ghost" id="test">🔊 Probar voz</button></div>
  </form>
  <div class="card"><h3>💾 Respaldo de progreso</h3><p class="muted">Tu progreso se guarda en este navegador${storageOK?"":" <b>(⚠️ este navegador no permite guardar: usa el respaldo)</b>"}. Para pasarlo a otro dispositivo, copia este código y pégalo allá en “Restaurar”.</p>
   <textarea id="exp" rows="3" readonly>${code}</textarea><div class="row"><button class="btn" id="cp">📋 Copiar código</button></div>
   <h3>Restaurar</h3><textarea id="imp" rows="3" placeholder="Pega aquí tu código de respaldo"></textarea><div class="row"><button class="btn" id="im">Restaurar progreso</button></div>
   <h3>Reiniciar</h3><div class="row"><button class="btn bad" id="rs">Borrar todo mi progreso</button></div><div id="rsc"></div></div>`);
  $("[name=rate]").oninput = e => $("#rv").textContent = e.target.value;
  $("#sf").onsubmit = ev => { ev.preventDefault(); const f = new FormData(ev.target); S.settings.name = f.get("name")||"Jenn"; S.settings.accent = f.get("accent"); S.settings.rate = parseFloat(f.get("rate")); S.settings.free = !!f.get("free"); save(); toast("Ajustes guardados ✅"); };
  $("#test").onclick = () => { const f = new FormData($("#sf")); S.settings.accent = f.get("accent"); S.settings.rate = parseFloat(f.get("rate")); speak("Hello Jenn! Welcome to your English Lab. Today it is partially cloudy in Bogotá."); };
  $("#cp").onclick = async () => { try{ await navigator.clipboard.writeText($("#exp").value); toast("Código copiado ✅"); }catch(e){ $("#exp").select(); toast("Selecciónalo y cópialo manualmente"); } };
  $("#im").onclick = () => { try{ const s = JSON.parse(decodeURIComponent(escape(atob($("#imp").value.trim())))); if (!s.units) throw 0; S = Object.assign(defState(), s); save(); toast("Progreso restaurado ✅"); go("progress"); }catch(e){ toast("Código no válido"); } };
  $("#rs").onclick = () => { $("#rsc").innerHTML = `<p class="warn">¿Seguro? Esto borra todo. <button class="btn bad sm" id="rs2">Sí, borrar</button></p>`; $("#rs2").onclick = () => { const st = S.settings; S = defState(); S.settings = st; save(); toast("Progreso reiniciado"); go("home"); }; };
};
